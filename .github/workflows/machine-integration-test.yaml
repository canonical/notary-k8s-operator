name: Machine Integration Tests

on:
  workflow_call:
    inputs:
      path:
        description: Path to the machine charm root
        required: true
        type: string
      artifacts-key:
        description: Key used to download the built charm artifact
        required: true
        type: string

jobs:
  integration-matrix:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
      - id: suites
        working-directory: ${{ inputs.path }}
        run: |
          suites="$(find tests/integration -name 'test_*.py' -printf '%f\n' | jq -r -ncR '[inputs]')"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  integration-tests:
    needs: [integration-matrix]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.integration-matrix.outputs.suites) }}
        base: ["24.04", "26.04"]
        include:
          - base: "24.04"
            runner: [self-hosted, linux, X64, large, noble]
          - base: "26.04"
            runner: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@main
        with:
          juju-channel: 3.6/stable
          provider: lxd
          lxd-channel: 5.21/stable
      - name: Install UV and Tox
        run: |
          pipx uninstall tox
          sudo snap install astral-uv --classic
          uv tool install tox --with tox-uv --force
      - name: Fetch charm under test
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifacts-key }}
          path: ${{ inputs.path }}/built
      - name: Get charm path
        id: charm-path
        env:
          BASE: ${{ matrix.base }}
        working-directory: ${{ inputs.path }}
        run: |
          shopt -s nullglob
          charms=(built/*"ubuntu@${BASE}-amd64.charm")
          if [[ ${#charms[@]} -ne 1 ]]; then
            echo "Expected exactly one charm artifact for ubuntu@${BASE}-amd64, found ${#charms[@]}" >&2
            exit 1
          fi
          echo "charm_path=${charms[0]}" >> "$GITHUB_OUTPUT"
      - name: Run integration tests
        working-directory: ${{ inputs.path }}
        run: |
          tox -e integration -- \
            --charm_path=${{ steps.charm-path.outputs.charm_path }} \
            --base=ubuntu@${{ matrix.base }} \
            -k "${{ matrix.suite }}"
      - name: Archive charmcraft logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: machine-charmcraft-logs-${{ matrix.suite }}-${{ matrix.base }}
          path: /home/runner/.local/state/charmcraft/log/*.log
          if-no-files-found: ignore
      - name: Archive Juju crashdump
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: machine-juju-crashdump-${{ matrix.suite }}-${{ matrix.base }}
          path: ${{ inputs.path }}/juju-crashdump-*.tar.xz
          if-no-files-found: ignore
      - name: Archive Juju debug log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: machine-juju-debug-log-${{ matrix.suite }}-${{ matrix.base }}
          path: ${{ inputs.path }}/juju-debug.log
          if-no-files-found: ignore