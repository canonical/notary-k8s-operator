name: Machine charm

on:
  pull_request:
    paths:
      - machine/**
      - .github/workflows/machine-build.yaml
      - .github/workflows/machine-integration-test.yaml
  push:
    branches:
      - main
    paths:
      - machine/**
      - .github/workflows/machine-build.yaml
      - .github/workflows/machine-integration-test.yaml

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.5
      - uses: canonical/identity-credentials-workflows/.github/actions/setup-toolchains@v3.1.5
        with:
          working-directory: machine
          toolchains: python
      - name: Install charmcraft
        run: sudo snap install charmcraft --classic
      - name: Fetch charmcraft libs
        working-directory: machine
        run: charmcraft fetch-libs
      - name: Check shared modules are synchronized
        run: make check-shared-modules
      - uses: canonical/identity-credentials-workflows/.github/actions/code-quality@v3.1.5
        with:
          working-directory: machine
          python-enabled: "true"
      - uses: canonical/identity-credentials-workflows/.github/actions/unit-test@v3.1.5
        with:
          working-directory: machine
          python-enabled: "true"

  build:
    needs: [quality]
    uses: canonical/identity-credentials-workflows/.github/workflows/charm-build.yaml@v3.1.5
    secrets: inherit
    with:
      path: machine
      artifact-suffix: machine

  integration:
    needs: [build]
    uses: ./.github/workflows/machine-integration-test.yaml
    with:
      path: machine
      artifacts-key: ${{ needs.build.outputs.artifacts-key }}
