name: notary
type: charm
title: Notary
summary: Certificate management made easy

description: |
  Notary helps you manage certificate requests and their associated certificates.
  Charmed Notary helps you automatically receive CSRs and distribute certificates to the applications
  you've deployed in your model.

links:
  documentation: https://discourse.charmhub.io/t/notary-docs-index/15216
  issues:
    - https://github.com/canonical/notary-k8s-operator/issues
  source:
    - https://github.com/canonical/notary-k8s-operator
  website:
    - https://charmhub.io/notary

platforms:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:

actions:
  restore-backup:
    description: |
      Replace this single unit's database with a backup created on the same unit.
      Stops Notary during restore. Multi-unit and cross-deployment recovery are unsupported.
    params:
      backup-id:
        type: string
        description: Full S3 object key or unprefixed Notary backup ID within the configured S3 path.
    required: [backup-id]
    additionalProperties: false
  list-backups:
    description: List backup IDs in the configured S3 path as a JSON array.
  create-backup:
    description: |
      Create a physical database backup in S3 and return its backup-id.
      Supported on a single-unit deployment only. Briefly stops Notary.

config:
  options:
    external-hostname:
      description: Hostname Notary expects all clients to use.
      type: string
    email:
      description: Account email for the configured ACME server.
      type: string
    server:
      description: ACME server directory URL.
      type: string
    plugin:
      description: LEGO DNS plugin used to solve DNS-01 challenges.
      type: string
    plugin-config-secret-id:
      description: ID of the Juju secret containing the selected LEGO plugin credentials.
      type: string
    snap-channel:
      description: Snap channel used to install and refresh Notary.
      type: string
      default: latest/edge

provides:
  managed-certificates:
    interface: tls-certificates
    optional: true
  self-signed-certificates:
    interface: tls-certificates
    optional: true
  acme-certificates:
    interface: tls-certificates
    optional: true
  send-access-ca-certificate:
    interface: certificate_transfer
    optional: true
  metrics:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true

peers:
  notary-peers:
    interface: notary_peers

requires:
  s3-parameters:
    interface: s3
    limit: 1
    optional: true
  access-certificates:
    interface: tls-certificates
    limit: 1
    optional: true
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    limit: 1
    optional: true
  ingress:
    interface: ingress
    limit: 1
    optional: true

storage:
  config:
    type: filesystem
    location: /var/snap/notary/common/config
    minimum-size: 5M
  database:
    type: filesystem
    location: /var/snap/notary/common/notary/database
    minimum-size: 1G

charm-libs:
  - lib: data_platform_libs.s3
    version: "0.6"
  - lib: grafana_k8s.grafana_dashboard
    version: "0.36"
  - lib: loki_k8s.loki_push_api
    version: "1.12"
  - lib: operator_libs_linux.snap
    version: "2.10"
  - lib: prometheus_k8s.prometheus_scrape
    version: "0.47"
  - lib: tempo_coordinator_k8s.charm_tracing
    version: "0.4"
  - lib: tempo_coordinator_k8s.tracing
    version: "0.3"
  - lib: traefik_k8s.ingress
    version: "2.19"

parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
      - astral-uv